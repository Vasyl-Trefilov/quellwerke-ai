[package]
name = "axum-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4" }
tokio = { version = "1", features = ["full"] }
tower = "0.5.2"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = "0.27.0"
dotenv = "0.15"
tower-http = { version = "0.6.6", features = ["cors"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "macros", "runtime-tokio-rustls", "chrono"] }
chrono = {version = "0.4.41", features = ["serde"]}
async-trait = "0.1.88"
http = "1.3.1"
axum-core = "0.5.2"
reqwest = { version = "0.12", features = ["json"] }
url = "2.5.5"
regex = "1.11.1"
scraper = "0.24.0"
anyhow = "1.0.99"
